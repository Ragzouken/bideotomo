<script id="grammars/videotome" type="text/pegjs">
{{
  function filter(line) {
    return line && Object.values(line).filter(value => value).length > 0;
  }
}}

{
  // strip end of line comments
  input = input.replace(/\/\/[^\n]*\n/g, "\n");
}

Script
  = __ lines:ScriptLine |.., _ "\n"| __ { return lines.filter(filter); }

ScriptLine
  = ">" _ event:EventPath { return { event } }
  / ":" _ label:EventPath { return { label } }
  / "$" _ script:FreeText { return { script } }
  / style:CSS |..| " " text:FreeText { return { style, text } }
  / Choice
  / TextLine

CSS
  = "[" attr:EventPath "]" { return { attr } }
  / "." cls:EventPath { return { cls } }

Choice
  = choice:ChoiceLine |1.., _ "\n"| { return { choice } }

ChoiceLine
  = "?" _ event:EventPath _ label:FreeText { return { event, label } }

TextLine
  = escape:"_"? tags:Tags? text:FreeText? { return { tags, text, escape } }

Tags
  = @Tag |1.., _| " - "

Tag
  = $[^ \n\-]+

EventPath
  = $[A-Za-z0-9_/\-]+

FreeText
  = $[^\n]+

_ = [ \t]*
__ = [ \t\r\n]*
</script>
