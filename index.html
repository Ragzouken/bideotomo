<!-- DEFINE DATA GRAMMARS -->
<script id="grammars/videotome" type="text/pegjs">
Script
  = lines:(CommentLine / ScriptLine)+ { return lines.filter(line => line) }

CommentLine
  = "//" [^"\n"]* "\n" { }

ScriptLine
  = _ commands:Commands? text:DisplayText? "\n" _ { return {commands, text}; }

Commands
  = first:Command rest:CommandTail* " - " { return [first, ...rest] }

CommandTail
  = " " @Command

Command
  = [^" "\n\-]+ { return text(); }

DisplayText
  = [^\n]+ { return text(); }

_  = [ \t\r\n]*

__ = [ \t\r\n]+
</script>

<script id="test">

function make_road(distance) {
  const parts = [];
  for (let i = distance; i > 0; --i) {
    parts.push("|", "|", "|", "|");

    if (i <= 5 || i % 10 == 0)
      parts.push(`M! - ${i * 10}`);
    else
      parts.push("|");
  }
  parts.push("|", "|", "|", "|");
  return parts.join("\n");
}

function make_end() {
  const parts = [];
  parts.push("|", "|", "|", "|");
  parts.push(`M! - NO END`);
  for (let i = 0; i < 100; ++i)
    parts.push("|", "|", "|", "|");
  return parts.join("\n");
}

const dataElement = document.getElementById("passages/main");
const macros = [
  ["", make_road(0)],
  ["#00", make_road(0)],
  ["#01", make_road(1)],
  ["#05", make_road(5)],
  ["#10", make_road(10)],
  ["#20", make_road(20)],
  ["#end", make_end()],
];

for (const [tag, replace] of macros) {
  dataElement.textContent = 
    dataElement.textContent.replaceAll(`\n${tag}\n`, `\n${replace}\n`);
}
</script>
